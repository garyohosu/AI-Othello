# モデル設定の例。config/models.yaml にコピーして使う（models.yaml は Git 管理外）。
# APIキー・認証情報はここに書かない。OSの環境変数か各CLIのログイン状態を使う
# （env に KEY / TOKEN / SECRET / PASSWORD を含む名前を書くと設定エラーになる）。
#
# 項目:
#   id             一意のID（英数字と . _ -）
#   provider       mock | cli
#   model          CLIに渡すモデル名。command 内の {model} に入る
#   command        実行コマンドの引数配列。プレースホルダ:
#                    {python}  実行中のPython   {project} このリポジトリのルート
#                    {model}   model の値
#                    {prompt}  プロンプト本文を引数として渡す（.cmd/.bat では使えない）
#                    {prompt_file} プロンプトを対局ごとの workdir/prompt.txt に書いてそのパスを渡す
#                  {prompt} も {prompt_file} もなければ、プロンプトは標準入力で渡す
#   env            追加の環境変数（認証情報は不可）
#   timeout_sec    応答タイムアウト（省略時は rules.yaml の default_timeout_sec）
#   output         text（標準出力全体が回答）| json（json_field の値が回答）
#   json_field     output: json のとき回答本文のパス（例: result、choices.0.text）
#   usage_fields   JSONから取り出す付帯情報のパス（actual_model / input_tokens / output_tokens / cost_usd）
#   version_command  CLIバージョン取得コマンド（課金のない呼び出しのみ）
#   sandbox        restricted | unrestricted | unknown。restricted 以外は大会に参加できない
#   sandbox_note   制限方法や制限できない理由のメモ
#   enabled        false で総当たりの既定対象から外す

models:
  # --- モック（課金なし。テスト・動作確認用） ---
  - id: mock-first
    provider: mock
    model: first-legal
    command: ["{python}", "{project}/tests/mock_cli.py", "--actions", "legal"]
    timeout_sec: 10
  - id: mock-json
    provider: mock
    model: first-legal-json
    command: ["{python}", "{project}/tests/mock_cli.py", "--actions", "json"]
    output: json
    json_field: result
    usage_fields:
      actual_model: model
      input_tokens: usage.input_tokens
      output_tokens: usage.output_tokens
      cost_usd: total_cost_usd
    timeout_sec: 10

  # --- 実CLI（Instruction00002 で --help / --version のみ確認。AIへの問い合わせは一度もしていない） ---
  # すべて enabled: false、sandbox: unknown / unrestricted のため、このままでは大会に参加しない。
  # 使う前に README の「実CLIを使う前のチェックリスト」を確認し、ユーザーの承認を得ること。
  # model の値は未確認のプレースホルダ。実在するモデルIDは各CLIで確認して書き換える。

  # Claude Code CLI 2.1.295（Windows: claude.exe）。Result00009 で検証:
  #   --tools "" で組み込みツールを無効にした状態で「ファイル作成」「コマンド実行」を依頼したところ、
  #   claude-haiku-5-5 / claude-sonnet-5-5 とも拒否（CANNOT_WRITE / NO_TOOLS）し、ファイルは作成されなかった。
  #   これはモデルの応答とファイルの有無による確認であり、CLI の仕様としての完全保証ではない。
  #   実際の対局用 models.yaml は enabled: true にして使う（この例では既定で無効）。
  - id: claude-haiku
    provider: cli
    model: "claude-haiku-5-5"
    command: ["claude", "-p", "{prompt}", "--model", "{model}", "--output-format", "text",
              "--tools", "", "--no-session-persistence", "--strict-mcp-config",
              "--disable-slash-commands", "--permission-prompts", "none", "--max-budget-usd", "0.05"]
    version_command: ["claude", "--version"]
    timeout_sec: 120
    sandbox: restricted
    sandbox_note: "--tools \"\" で組み込みツール無効。ファイル作成・コマンド実行の依頼が失敗することを確認（Result00009）"
    enabled: false

  - id: claude-sonnet
    provider: cli
    model: "claude-sonnet-5-5"
    command: ["claude", "-p", "{prompt}", "--model", "{model}", "--output-format", "text",
              "--tools", "", "--no-session-persistence", "--strict-mcp-config",
              "--disable-slash-commands", "--permission-prompts", "none", "--max-budget-usd", "0.05"]
    version_command: ["claude", "--version"]
    timeout_sec: 120
    sandbox: restricted
    sandbox_note: "claude-haiku と同じ CLI フラグ。ファイル作成の依頼が失敗することを確認（Result00009）"
    enabled: false

  # Codex CLI 0.161.0（Windows: npm の codex.cmd。{prompt} は使えないので標準入力で渡す）
  # ヘルプで確認: exec（非対話）、PROMPT 省略または - で標準入力から読む、-m/--model、
  #   -s/--sandbox read-only|workspace-write|danger-full-access、--ephemeral、--skip-git-repo-check、
  #   --ignore-user-config、--color never、--json（JSONLイベント）、-o/--output-last-message <FILE>
  # 未確認: 最終回答だけが標準出力に出るか（-o の方が確実な可能性）、トークン・費用の取得方法
  # sandbox: -s read-only はモデルが生成したシェルコマンドの「書き込み」を制限するだけで、
  #   コマンド実行自体を止めるオプションはヘルプに見当たらない → 任意コード実行を抑止できないため unrestricted
  - id: codex-cheap
    provider: cli
    model: "<未確認: 廉価モデルID>"
    command: ["codex", "exec", "-m", "{model}", "-s", "read-only", "--ephemeral",
              "--skip-git-repo-check", "--ignore-user-config", "--color", "never", "-"]
    version_command: ["codex", "--version"]
    timeout_sec: 180
    sandbox: unrestricted
    sandbox_note: "シェルコマンド実行を無効化するオプションがヘルプにない（read-only は書き込み制限のみ）"
    enabled: false

  # Gemini CLI 0.50.0（Windows: npm の gemini.cmd。{prompt} は使えないので標準入力で渡す）
  # ヘルプで確認: -p/--prompt（ヘッドレス。標準入力の内容の後ろに追加される）、-m/--model、
  #   -o/--output-format text|json|stream-json、--approval-mode plan（読み取り専用モード）、-s/--sandbox、
  #   --policy（ポリシーエンジン）
  # 未確認: -p "" と標準入力の組み合わせで動くか、plan モードでシェル実行が止まるか、JSON のフィールド名
  - id: gemini-cheap
    provider: cli
    model: "<未確認: 廉価モデルID>"
    command: ["gemini", "-m", "{model}", "-p", "", "--approval-mode", "plan", "-o", "text"]
    version_command: ["gemini", "--version"]
    timeout_sec: 120
    sandbox: unknown
    sandbox_note: "--approval-mode plan は読み取り専用モード（ヘルプ記載）。シェル実行の可否は未検証"
    enabled: false

  # Grok Build CLI 0.2.112（Windows: grok.exe）
  # ヘルプで確認: -p/--single <PROMPT>（1ターンで標準出力に出して終了）、--prompt-file、-m/--model、
  #   --output-format plain|json|streaming-json、--tools / --disallowed-tools、--disable-web-search、
  #   --no-subagents、--no-memory、--max-turns、--sandbox <PROFILE>
  # 未確認: --tools "" で全ツール無効になるか、sandbox プロファイル名、JSON のフィールド名、モデルID
  #   （grok models は通信の可能性があるため実行していない）
  - id: grok-cheap
    provider: cli
    model: "<未確認: 廉価モデルID>"
    command: ["grok", "-p", "{prompt}", "-m", "{model}", "--output-format", "plain",
              "--tools", "", "--disable-web-search", "--no-subagents", "--no-memory", "--max-turns", "1"]
    version_command: ["grok", "--version"]
    timeout_sec: 120
    sandbox: unknown
    sandbox_note: "--tools \"\" の挙動は未検証"
    enabled: false
